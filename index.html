  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

; }\n  a:hover { text-decoration-color:var(--ink); }\n  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.45; transform:scale(.7);} }\n  @keyframes rise { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none;} }\n  @keyframes pageRise { 0% { opacity:0; transform:translateY(34px) scale(.975); filter:blur(10px);} 60% { filter:blur(0);} 100% { opacity:1; transform:none; filter:none;} }\n  [data-page-in=\"pending\"] > * { opacity:0; }\n  [data-page-in=\"go\"] > * { animation:pageRise .95s cubic-bezier(.16,.84,.24,1) both; }\n  [data-page-in=\"go\"] > *:nth-child(1) { animation-delay:.05s; } [data-page-in=\"go\"] > *:nth-child(2) { animation-delay:.14s; } [data-page-in=\"go\"] > *:nth-child(3) { animation-delay:.22s; } [data-page-in=\"go\"] > *:nth-child(4) { animation-delay:.3s; } [data-page-in=\"go\"] > *:nth-child(5) { animation-delay:.38s; } [data-page-in=\"go\"] > *:nth-child(6) { animation-delay:.46s; } [data-page-in=\"go\"] > *:nth-child(n+7) { animation-delay:.54s; }\n  @keyframes dockIn { from { opacity:0; transform:translate(-50%, 24px) scale(.96);} to { opacity:1; transform:translate(-50%, 0) scale(1);} }\n  @keyframes burst { 0% { transform:scale(.6); opacity:.9; } 100% { transform:scale(2.1); opacity:0; } }\n  @keyframes sparkle { 0% { transform:translate(-50%,-50%) scale(0) rotate(0deg); opacity:1; } 100% { transform:translate(-50%,-50%) scale(1.15) rotate(90deg); opacity:0; } }\n  @keyframes blink { 0%, 92%, 100% { transform:scaleY(1); } 95% { transform:scaleY(.08); } }\n  @keyframes bob { 0%, 100% { transform:translateY(0); } 50% { transform:translateY(-1.5px); } }\n  @keyframes hop { 0% { transform:translateY(0) scale(1); } 35% { transform:translateY(-6px) scale(1.06, .94); } 70% { transform:translateY(0) scale(.96, 1.04); } 100% { transform:none; } }\n  @keyframes composerIn { from { opacity:0; transform:translateY(14px) scale(.92); } to { opacity:1; transform:none; } }\n  @keyframes introOut { to { opacity:0; transform:scale(1.03); } }\n  @keyframes pillIn { from { opacity:0; transform:translateY(24px) scale(.7); } to { opacity:1; transform:none; } }\n  @keyframes pillOut { to { opacity:0; transform:translateY(40px) scale(.6); } }\n  @keyframes bigIn { from { opacity:0; transform:translateY(18px) scale(.94); } to { opacity:1; transform:none; } }\n  @keyframes botDrop { 0% { transform:translateY(-40px) scale(.3); opacity:0; } 55% { transform:translateY(6px) scale(1.08, .92); opacity:1; } 75% { transform:translateY(-3px) scale(.97, 1.03); } 100% { transform:none; } }\n  @keyframes excited { 0%,100% { transform:rotate(0) scale(1); } 20% { transform:rotate(-7deg) scale(1.06, .94); } 45% { transform:rotate(6deg) scale(.95, 1.06); } 70% { transform:rotate(-3deg) scale(1.03, .97); } }\n  [data-orb]:hover > span, [data-intro-pill]:hover [data-intro-bot] { animation:excited .9s cubic-bezier(.34,1.56,.64,1) infinite !important; transform-origin:50% 60%; }\n  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }\n  @keyframes spin { to { transform:rotate(360deg);} }\n  @keyframes popIn { from { opacity:0; transform:translate(-50%, 8px) scale(.97);} to { opacity:1; transform:translate(-50%, 0) scale(1);} }\n  button { font-feature-settings:'ss01'; }\n  [data-intro-pill]:hover { color:var(--ink) !important; box-shadow:inset 0 0 0 1px var(--line-2), 0 14px 28px -16px rgba(var(--shadow-rgb),.3) !important; }\n  button:not([data-orb]):not([data-intro-pill]):hover > span:last-child { opacity:1 !important; transform:translate(-50%, 0) !important; }\n  [data-tip-on] > [data-tip] { opacity:1 !important; transform:translateY(0) scale(1) !important; }\n  main > p:has([data-tip-on]) { position:relative; z-index:60; }\n  main > p { position:relative; }\n  @media (max-width: 640px) {\n    main { padding:64px 20px 140px !important; font-size:15.5px !important; }\n    [data-two-col] { grid-template-columns:minmax(0,1fr) !important; gap:18px !important; }\n    [data-tools-grid] { grid-template-columns:minmax(0,1fr) !important; gap:4px 0 !important; }\n    [data-tools-grid] > div:nth-child(even) { margin-bottom:10px; }\n    [data-open-badge] { display:none !important; }\n    [data-flags] { top:12px !important; right:12px !important; }\n    [data-dock] { bottom:14px !important; }\n    [data-dock] > div:last-child > button, [data-dock] > div:last-child > a { width:32px !important; height:32px !important; }\n    [data-dock] > div:last-child > span { margin:0 1px !important; }\n    [data-dock] [data-dock-pop] { min-width:0 !important; width:min(320px, calc(100vw - 28px)) !important; }\n    [data-orb-wrap] { right:14px !important; bottom:74px !important; }\n    [data-chat] { width:calc(100vw - 28px) !important; }\n    [data-chat] [data-thread] { max-height:min(360px, calc(100vh - 240px)) !important; }\n  }\n  @media print { body { background:#fff !important; } main { max-width:none !important; padding-top:0 !important; } [data-print-hide] { display:none !important; } a { color:inherit; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n<sc-if value=\"{{ pageShown }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-print-hide=\"\" data-flags=\"\" style=\"position:fixed; top:20px; right:24px; z-index:40; display:flex; gap:4px; padding:4px; border-radius:999px; background:var(--card); box-shadow:0 0 0 1px var(--line), 0 10px 24px -14px rgba(var(--shadow-rgb),.35); animation:rise .6s .4s cubic-bezier(.2,.8,.2,1) both;\">\n  <sc-for list=\"{{ langs }}\" as=\"l\" hint-placeholder-count=\"3\">\n    <button sc-camel-on-click=\"{{ l.pick }}\" title=\"{{ l.label }}\" aria-label=\"{{ l.label }}\" style=\"width:28px; height:28px; padding:0; border:0; border-radius:50%; background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; opacity:{{ l.op }}; transform:scale({{ l.sc }}); filter:saturate({{ l.sat }}); transition:opacity .25s, transform .3s cubic-bezier(.34,1.56,.64,1), filter .25s, box-shadow .25s; box-shadow:{{ l.shadow }};\" style-hover=\"opacity: 1; filter: saturate(1);\">\n      <img src=\"{{ l.flag }}\" alt=\"\" style=\"width:20px; height:20px; border-radius:50%; object-fit:cover; display:block;\">\n    <\u002Fbutton>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<main data-page-in=\"{{ pageIn }}\" style=\"max-width:620px; margin:0 auto; padding:80px 24px 128px; font-size:16px; line-height:1.7; letter-spacing:-0.005em; opacity:{{ mainOp }}; filter:blur({{ mainBlur }}px); transition:opacity .28s ease, filter .28s ease;\">\n\n  <header style=\"display:flex; align-items:center; gap:16px; margin-bottom:44px;\">\n    <div style=\"position:relative; width:56px; height:56px; flex:none;\">\n      <img src=\"c89427a7-cff9-499f-93c8-24c3d59b7614\" alt=\"Carlos R. Morales\" style=\"width:56px; height:56px; border-radius:50%; object-fit:cover; background:var(--fill); box-shadow:0 0 0 1px var(--ring), 0 1px 2px rgba(var(--shadow-rgb),.06);\">\n      <span style=\"position:absolute; right:1px; bottom:1px; width:12px; height:12px; border-radius:50%; background:#2f9e5a; border:2px solid var(--bg); box-sizing:border-box;\"><\u002Fspan>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:17px; font-weight:600; line-height:1.3; letter-spacing:-0.01em; display:flex; align-items:center; gap:6px;\">Carlos R. Morales <img src=\"c3d84a50-ffe7-4d07-8fd4-60d5e948ce83\" alt=\"\" style=\"width:14px; height:14px; opacity:.55;\"><\u002Fdiv>\n      <div style=\"font-size:15px; color:var(--ink-2); line-height:1.4;\">AI &amp; Software Engineer · Florianópolis, BR<\u002Fdiv>\n      <div style=\"font-family:'Geist Mono', monospace; font-size:12px; color:var(--ink-3); line-height:1.5; margin-top:4px;\">AI · Software · Inference · cloud · leadership<\u002Fdiv>\n    <\u002Fdiv>\n    <a data-open-badge=\"\" href=\"mailto:crmorales5dh@gmail.com\" title=\"Open for work\" style=\"margin-left:auto; position:relative; width:84px; height:84px; flex:none; display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--ink);\">\n      <svg sc-camel-view-box=\"0 0 100 100\" width=\"84\" height=\"84\" style=\"position:absolute; inset:0; animation:spin 14s linear infinite;\">\n        <defs><path id=\"circ\" d=\"M50,50 m-36,0 a36,36 0 1,1 72,0 a36,36 0 1,1 -72,0\"><\u002Fpath><\u002Fdefs>\n        <text style=\"font-family:'Geist Mono', monospace; font-size:9.5px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; fill:var(--ink-2);\"><textPath href=\"#circ\" sc-camel-text-length=\"226\" sc-camel-length-adjust=\"spacing\">open for work · open for work ·<\u002FtextPath><\u002Ftext>\n      <\u002Fsvg>\n      <span style=\"width:10px; height:10px; border-radius:50%; background:#2f9e5a; box-shadow:0 0 0 4px rgba(47,158,90,.15); animation:pulse 2.2s ease-in-out infinite;\"><\u002Fspan>\n    <\u002Fa>\n  <\u002Fheader>\n\n  <p style=\"margin:0 0 20px;\">I'm Carlos Morales, an AI and software engineer based in Florianópolis. I build AI systems and the software around them, from published research on deep learning for sensor networks to production agents, retrieval pipelines and inference infrastructure. I treat LLMs as a new kind of runtime, and I care about the parts around the model that decide whether it ships: routing, tool access, evaluation, and cost. I work across model providers rather than betting on one. I'm open to remote or hybrid roles in any time zone; I adjust my hours to the team.<\u002Fp>\n\n  <p style=\"margin:0 0 20px;\">Today I'm at <span style=\"position:relative; display:inline-block;\" sc-camel-on-mouse-enter=\"{{ tipShow }}\" sc-camel-on-mouse-leave=\"{{ tipHide }}\" sc-camel-on-mouse-move=\"{{ tipMove }}\"><a href=\"https://www.wiline.com\" style=\"text-decoration:none; font-family:'Geist Mono', monospace; font-size:14.5px; font-weight:500; letter-spacing:-0.01em; border-bottom:1px solid var(--line-2); transition:border-color .15s;\" style-hover=\"border-color: var(--ink);\">WiLine<\u002Fa><span data-tip=\"\" style=\"position:absolute; top:calc(100% + 12px); left:0; width:260px; z-index:60; background:var(--pop); color:var(--pop-ink); box-shadow:0 14px 40px -12px rgba(var(--shadow-rgb),.5), 0 0 0 1px rgba(var(--pfg),.08), inset 0 1px 0 rgba(var(--pfg),.06); border-radius:12px; padding:12px 14px; font-family:'Instrument Sans', Helvetica, sans-serif; font-size:13.5px; line-height:1.5; letter-spacing:0;  opacity:0; transform:translateY(6px) scale(.98); pointer-events:none; transition:opacity .18s cubic-bezier(.2,.8,.2,1), transform .18s cubic-bezier(.2,.8,.2,1); will-change:transform;\"><span style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:22px; height:22px; border-radius:6px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); display:inline-flex; align-items:center; justify-content:center; flex:none;\"><img src=\"https://www.google.com/s2/favicons?domain=wiline.com&amp;sz=64\" alt=\"\" style=\"width:13px; height:13px; object-fit:contain;\"><\u002Fspan><span style=\"font-family:'Geist Mono', monospace; font-size:12px; color:var(--pop-ink);\">WiLine<\u002Fspan><\u002Fspan>US telecom founded in 2002, now the largest fixed-wireless ISP in the country across 600+ markets, expanding from connectivity into AI infrastructure and edge compute.<\u002Fspan><\u002Fspan>, the largest fixed-wireless ISP in the US, where I lead development of WiLine Edge Cloud, a neo-cloud where a VM with CPU, GPU and storage runs seconds after one click. On top of it I built Inference as a Service: open models on WiLine GPUs behind a standard API, with a model catalog, budgets and an AI Router that picks the model per request.<\u002Fp>\n\n  <p style=\"margin:0 0 20px;\">Before that I led a team of five developers at <span style=\"position:relative; display:inline-block;\" sc-camel-on-mouse-enter=\"{{ tipShow }}\" sc-camel-on-mouse-leave=\"{{ tipHide }}\" sc-camel-on-mouse-move=\"{{ tipMove }}\"><a href=\"https://certi.org.br\" style=\"text-decoration:none; font-family:'Geist Mono', monospace; font-size:14.5px; font-weight:500; letter-spacing:-0.01em; border-bottom:1px solid var(--line-2); transition:border-color .15s;\" style-hover=\"border-color: var(--ink);\">CERTI<\u002Fa><span data-tip=\"\" style=\"position:absolute; top:calc(100% + 12px); left:0; width:260px; z-index:60; background:var(--pop); color:var(--pop-ink); box-shadow:0 14px 40px -12px rgba(var(--shadow-rgb),.5), 0 0 0 1px rgba(var(--pfg),.08), inset 0 1px 0 rgba(var(--pfg),.06); border-radius:12px; padding:12px 14px; font-family:'Instrument Sans', Helvetica, sans-serif; font-size:13.5px; line-height:1.5; letter-spacing:0;  opacity:0; transform:translateY(6px) scale(.98); pointer-events:none; transition:opacity .18s cubic-bezier(.2,.8,.2,1), transform .18s cubic-bezier(.2,.8,.2,1); will-change:transform;\"><span style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:22px; height:22px; border-radius:6px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); display:inline-flex; align-items:center; justify-content:center; flex:none;\"><img src=\"https://www.google.com/s2/favicons?domain=certi.org.br&amp;sz=64\" alt=\"\" style=\"width:13px; height:13px; object-fit:contain;\"><\u002Fspan><span style=\"font-family:'Geist Mono', monospace; font-size:12px; color:var(--pop-ink);\">CERTI<\u002Fspan><\u002Fspan>Technology institute in Florianópolis, active since 1984, running applied R&amp;D for industry, including oil and gas programs with Petrobras.<\u002Fspan><\u002Fspan>, building digital twins of subsea assets for Petrobras oil and gas projects, as software lead inside a large agile team with designers, QA and specification engineers. Earlier I led development at <span style=\"position:relative; display:inline-block;\" sc-camel-on-mouse-enter=\"{{ tipShow }}\" sc-camel-on-mouse-leave=\"{{ tipHide }}\" sc-camel-on-mouse-move=\"{{ tipMove }}\"><a href=\"https://wirelessprecision.com\" style=\"text-decoration:none; font-family:'Geist Mono', monospace; font-size:14.5px; font-weight:500; letter-spacing:-0.01em; border-bottom:1px solid var(--line-2); transition:border-color .15s;\" style-hover=\"border-color: var(--ink);\">Wireless Precision<\u002Fa><span data-tip=\"\" style=\"position:absolute; top:calc(100% + 12px); left:0; width:260px; z-index:60; background:var(--pop); color:var(--pop-ink); box-shadow:0 14px 40px -12px rgba(var(--shadow-rgb),.5), 0 0 0 1px rgba(var(--pfg),.08), inset 0 1px 0 rgba(var(--pfg),.06); border-radius:12px; padding:12px 14px; font-family:'Instrument Sans', Helvetica, sans-serif; font-size:13.5px; line-height:1.5; letter-spacing:0;  opacity:0; transform:translateY(6px) scale(.98); pointer-events:none; transition:opacity .18s cubic-bezier(.2,.8,.2,1), transform .18s cubic-bezier(.2,.8,.2,1); will-change:transform;\"><span style=\"display:flex; align-items:center; gap:8px; margin-bottom:6px;\"><span style=\"width:22px; height:22px; border-radius:6px; background:#ffffff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); display:inline-flex; align-items:center; justify-content:center; flex:none;\"><img src=\"https://www.google.com/s2/favicons?domain=wirelessprecision.com&amp;sz=64\" alt=\"\" style=\"width:13px; height:13px; object-fit:contain;\"><\u002Fspan><span style=\"font-family:'Geist Mono', monospace; font-size:12px; color:var(--pop-ink);\">Wireless Precision<\u002Fspan><\u002Fspan>Florianópolis startup for industrial asset monitoring, pairing on-field sensors with a web platform for predictive maintenance.<\u002Fspan><\u002Fspan>, taking an industrial asset-management SaaS from idea to production. I've hired, mentored and run engineering teams as much as I've written code. You can reach me on <a href=\"https://www.linkedin.com/in/carlos-r-morales-b3484b159/\">LinkedIn<\u002Fa>, read me on <a href=\"https://medium.com/@crmorales5dh\">Medium<\u002Fa>, or see my code on <a href=\"https://github.com/Charlie5DH\">GitHub<\u002Fa>.<\u002Fp>\n\n  <p style=\"margin:0;\">I also care about how software looks and feels. I follow modern UI and UX design closely and bring it into the interfaces I build: clean layouts, restrained type and color, consistent spacing, and interactions that feel considered. I used to design in Figma; these days I design with Claude before I write the frontend, and I treat the interface as part of the engineering, not a layer added at the end.<\u002Fp>\n\n  <section id=\"work\" style=\"margin-top:64px;\">\n    <div style=\"font-family:'Geist Mono', monospace; font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); margin-bottom:12px;\">Work<\u002Fdiv>\n    <sc-for list=\"{{ work }}\" as=\"w\" hint-placeholder-count=\"4\">\n      <div style=\"border-left:1px solid var(--line); margin-left:6px;\">\n        <button sc-camel-on-click=\"{{ w.toggle }}\" style=\"display:flex; align-items:center; gap:12px; background:none; border:0; padding:7px 0; margin:0; cursor:pointer; font:inherit; width:100%; text-align:left; color:var(--ink-2); border-radius:6px;\" style-hover=\"color: var(--ink);\">\n          <span style=\"width:18px; height:1px; background:var(--line); display:inline-block; flex:none;\"><\u002Fspan>\n          <img src=\"{{ w.icon }}\" alt=\"\" style=\"width:18px; height:18px; border-radius:5px; flex:none; background:var(--fill); object-fit:contain;\">\n          <span style=\"color:{{ w.labelColor }}; flex:1; min-width:0; display:flex; align-items:baseline; gap:10px; font-weight:500;\"><span>{{ w.company }}<\u002Fspan><span style=\"font-size:13px; color:var(--ink-3); font-weight:400;\">{{ w.role }}<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:'Geist Mono', monospace; font-size:12px; color:var(--ink-3); flex:none;\">{{ w.period }}<\u002Fspan>\n        <\u002Fbutton>\n        <sc-if value=\"{{ w.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-left:36px; border-left:1px solid var(--line); padding:2px 0 10px; animation:rise .3s ease both;\">\n            <sc-if value=\"{{ w.hasRoles }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; align-items:flex-start; gap:12px; padding:7px 0 4px;\">\n                <span style=\"width:18px; height:1px; background:var(--line); display:inline-block; flex:none; margin-top:10px;\"><\u002Fspan>\n                <span style=\"display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; font-family:'Geist Mono', monospace; font-size:12px; color:var(--ink-3);\">\n                  <sc-for list=\"{{ w.roles }}\" as=\"r\" hint-placeholder-count=\"2\">\n                    <span style=\"display:inline-flex; align-items:center; gap:8px;\">\n                      <sc-if value=\"{{ r.arrow }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"opacity:.5;\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                      <span style=\"display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:6px; background:var(--fill); color:{{ r.color }};\"><span>{{ r.title }}<\u002Fspan><span style=\"opacity:.55;\">{{ r.period }}<\u002Fspan><\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ w.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:flex-start; gap:12px; padding:7px 0; font-size:15px;\">\n                <span style=\"width:18px; height:1px; background:var(--line); display:inline-block; flex:none; margin-top:12px;\"><\u002Fspan>\n                <span style=\"flex:1; min-width:0; display:flex; flex-direction:column; gap:3px;\">\n                  <span style=\"display:flex; align-items:center; gap:8px; min-width:0;\">\n family:'Geist Mono', monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); padding-left:50px;\">{{ introHint }}<\u002Fspan>\n          <span style=\"width:36px; height:36px; border-radius:50%; background:var(--ink); color:var(--bg); display:flex; align-items:center; justify-content:center; transform:scale({{ introSendSc }}); transition:transform .25s cubic-bezier(.2,.8,.2,1);\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5M5 12l7-7 7 7\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ introSkip }}\" style=\"position:absolute; bottom:28px; left:50%; transform:translateX(-50%); border:0; background:transparent; color:var(--ink-3); font-family:'Geist Mono', monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; padding:8px 12px; border-radius:8px; transition:color .15s;\" style-hover=\"color: var(--ink);\">skip intro<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;expandAll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Trees&quot;},&quot;skipIntro&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Intro&quot;}}\">\nclass Component extends DCLogic {\n  state = { lang: 'en', langBump: false, swapping: false, openWork: { wiline: true }, openYears: { '2023': true }, dock: '', copied: '', shared: '', expr: 'idle', phase: 'intro', leaving: false, introInput: '', askOpen: false, askMsgs: [], askInput: '', askStatus: 'online', busy: false, introDone: false, theme: (typeof localStorage !== 'undefined' && localStorage.getItem('crm-theme')) || 'system' };\n  effectiveTheme(t = this.state.theme) { return t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; }\n  applyTheme() { document.documentElement.setAttribute('data-theme', this.effectiveTheme()); }\n  setTheme(next, e) {\n    const run = () => { this.setState({ theme: next }, () => this.applyTheme()); };\n    if (e && e.currentTarget) { const r = e.currentTarget.getBoundingClientRect(); document.documentElement.style.setProperty('--vt-x', (r.left + r.width / 2) + 'px'); document.documentElement.style.setProperty('--vt-y', (r.top + r.height / 2) + 'px'); }\n    if (document.startViewTransition && this.effectiveTheme(next) !== this.effectiveTheme()) {\n      document.startViewTransition(() => { localStorage.setItem('crm-theme', next); this.setState({ theme: next }); this.applyTheme(); });\n    } else { localStorage.setItem('crm-theme', next); run(); }\n  }\n  ico = (s, v = 'default') => `https://thesvg.org/icons/${s}/${v}.svg`;\n  fav = d => `https://www.google.com/s2/favicons?domain=${d}&sz=64`;\n  work = [\n    { id: 'wiline', company: 'WiLine Networks', role: 'Lead Software Engineer', period: '2025 — now', icon: 'https://www.google.com/s2/favicons?domain=wiline.com&sz=64', items: [\n      { title: 'WiLine Edge Cloud', kind: 'Neo-cloud', desc: 'Hired to build the product that would move WiLine from ISP to cloud provider, and led its development end to end: customer-facing app, backend, billing and deployment. One-click virtual machines from presets or custom CPU, memory, GPU, storage and OS, plus private networks, elastic IPs, security groups, block and object storage, backups and snapshots. Worked directly with the CTO and sales engineering on the roadmap and with early customers on their deployments; the platform now anchors the company\\'s transition into cloud and AI infrastructure.' },\n      { title: 'Inference as a Service', kind: 'AI infra', desc: 'Open-source chat, speech-to-text and text-to-speech models hosted on WiLine GPUs behind one industry-standard endpoint. Model catalog with per-token prices, API keys with budgets and team access, an in-browser playground, and an AI Router that picks the model for each request by quality, latency and cost. Ran evaluations across open models to decide what goes in the catalog and how the router weights them.' },\n      { title: 'Corporate agentic platform', kind: 'Agents', desc: 'An internal platform for the whole company to build, share and run agents on its own data and tools. Agents with versioned prompts and a controlled set of tools, human approval with pause and resume, chained into workflows with a full run history. A shared knowledge base from web crawling and vector search, a tool server and integrations marketplace for outside systems, and delivery through messaging, webhooks, schedules, an embeddable chat widget and a desktop app. Every run is traced and evaluated: tokens, cost, latency, tool calls and scored outputs are visible per agent and per team, so automations can be trusted and tuned rather than guessed at. Ran workshops with each department to onboard their first agents.' },\n    ]},\n    { id: 'certi', company: 'CERTI', role: 'Software Team Lead', period: '2024 — 2025', icon: 'https://www.google.com/s2/favicons?domain=certi.org.br&sz=64', items: [\n      { title: 'Digital twins of subsea assets', kind: 'Oil & Gas', desc: 'Software team lead on Petrobras projects modelling submarine assets as digital twins, from planning to delivery. Led a team of five developers inside a large cross-functional group with designers, QA, specification engineers and an agile process, and was the technical point of contact for Petrobras engineers in requirement and acceptance sessions.' },\n    ]},\n    { id: 'wp', company: 'Wireless Precision', role: 'Lead Software Engineer', period: '2020 — 2024', icon: 'https://www.google.com/s2/favicons?domain=wirelessprecision.com&sz=64', roles: [\n      { title: 'Soft
